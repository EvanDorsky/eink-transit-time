; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
; bare `pio run` builds only the USB env; OTA is opt-in via -e crowpanel_ota
default_envs = crowpanel_epaper_579

[env:crowpanel_epaper_579]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_upload.flash_size = 8MB
board_build.arduino.memory_type = qio_opi
; dual app slots + otadata so OTA updates are possible (app fits with room to spare)
board_build.partitions = default_8MB.csv
build_flags =
    -DBOARD_HAS_PSRAM
lib_deps =
    zinggjm/GxEPD2@^1.6.2
    nanopb/Nanopb@^0.4.8
    bblanchon/ArduinoJson@^7.0.0
    knolleary/PubSubClient@^2.8
custom_nanopb_protos =
    +<proto/gtfs_realtime.proto>
upload_port = /dev/cu.usbserial-10
monitor_port = /dev/cu.usbserial-10

; OTA flashing over WiFi: pio run -e crowpanel_ota -t upload
[env:crowpanel_ota]
extends = env:crowpanel_epaper_579
upload_protocol = espota
upload_port = transit-display.local
upload_flags =
    --auth=transit-ota
