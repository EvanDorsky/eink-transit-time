; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
; bare `pio run` builds only the USB env; OTA is opt-in via -e crowpanel_ota
default_envs = crowpanel_epaper_579

; OTA password: the one place it's set. Compiled into the firmware and used
; by `pio run -e crowpanel_ota -t upload`.
[ota]
password = transit-ota

[env:crowpanel_epaper_579]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_upload.flash_size = 8MB
board_build.arduino.memory_type = qio_opi
; dual app slots + otadata so OTA updates are possible (app fits with room to spare)
board_build.partitions = default_8MB.csv
build_flags =
    -DBOARD_HAS_PSRAM
    -DOTA_PASSWORD=\"${ota.password}\"
; which stops to watch comes from env vars, not the repo (site.env.example)
extra_scripts = pre:scripts/site_env.py
lib_deps =
    zinggjm/GxEPD2@^1.6.2
    nanopb/Nanopb@^0.4.8
    bblanchon/ArduinoJson@^7.0.0
    knolleary/PubSubClient@^2.8
custom_nanopb_protos =
    +<proto/gtfs_realtime.proto>
; USB serial port is auto-detected; set upload_port / monitor_port here (or
; pass --upload-port) only if you have several boards plugged in

; OTA flashing over WiFi: pio run -e crowpanel_ota -t upload
[env:crowpanel_ota]
extends = env:crowpanel_epaper_579
upload_protocol = espota
upload_port = transit-display.local
upload_flags =
    --auth=${ota.password}
